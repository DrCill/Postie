<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Postie – chụp ảnh thành tem</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<style>
:root{--bg:#E6ECF0;--ink:#12343B;--paper:#FFFFFF;--red:#D1495B;--sun:#EDAE49;--mut:#5B7077;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1F24;--ink:#E6ECF0;--paper:#1B3239;--mut:#8FA5AC}}
:root[data-theme="dark"]{--bg:#0E1F24;--ink:#E6ECF0;--paper:#1B3239;--mut:#8FA5AC}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:22px;font-weight:800;margin:4px 0 14px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid color-mix(in srgb,var(--ink) 15%,transparent)}
.tabs button{flex:1;max-width:200px}
button{font:inherit;font-weight:600;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:10px 14px;border-radius:12px;cursor:pointer}
button.on{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.modes{display:flex;gap:8px;margin-bottom:14px}.modes button{flex:1}
.stage{position:relative;width:100%;aspect-ratio:1;background:#000;overflow:hidden;border-radius:32px}
.stage video,.stage img.pv{width:100%;height:100%;object-fit:cover;display:block}
.stage.stamp{background:var(--paper);border-radius:6px;padding:7% 7% 20%;aspect-ratio:480/560;height:auto}
.stage.stamp .in{width:100%;height:100%;overflow:hidden;background:#000;position:relative}
.stage.stamp::after{content:"";position:absolute;inset:-4px;border:9px dotted var(--bg);border-radius:8px;pointer-events:none}
.stage .in{width:100%;height:100%}
.stage .date{position:absolute;left:12px;bottom:10px;color:#fff;font-weight:600;font-size:13px;text-shadow:0 1px 4px #000}
.stage.stamp .date{left:7%;bottom:6%;color:var(--ink);text-shadow:none;font-size:15px}
.msg{position:absolute;inset:0;display:none;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;color:#fff;padding:20px;font-size:14px}
.msg.show{display:flex}
.msg label{background:var(--sun);color:#12343B;padding:10px 14px;border-radius:12px;font-weight:600;cursor:pointer}
.row{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:18px}
.shot{width:76px;height:76px;border-radius:50%;border:6px solid var(--ink);background:var(--red);padding:0}
.small{width:48px;height:48px;padding:0;border-radius:50%}
.hint{color:var(--mut);font-size:13px;text-align:center;margin-top:12px}
.filters{display:flex;gap:8px;margin-bottom:12px}.filters button{padding:6px 12px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.grid img{width:100%;display:block;cursor:pointer}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.view{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;z-index:20}
.view.show{display:flex}.view img{max-width:100%;max-height:70vh}
.view p{color:#fff;margin:0}.view .act{display:flex;gap:10px}
.view button{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.hide{display:none}
</style>
<style>
/* Liquid Glass */
:root{--glass:rgba(255,255,255,.28);--glass-on:rgba(255,255,255,.62);--glass-brd:rgba(255,255,255,.65);--glass-sh:rgba(18,52,59,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(255,255,255,.1);--glass-on:rgba(255,255,255,.22);--glass-brd:rgba(255,255,255,.22);--glass-sh:rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--glass:rgba(255,255,255,.1);--glass-on:rgba(255,255,255,.22);--glass-brd:rgba(255,255,255,.22);--glass-sh:rgba(0,0,0,.45)}
body{background:radial-gradient(60% 40% at 12% 8%,#7fd6e0 0,transparent 62%),radial-gradient(50% 40% at 92% 28%,#f6b7c0 0,transparent 62%),radial-gradient(60% 50% at 30% 96%,#f7d28c 0,transparent 62%),#dfe9ee;background-attachment:fixed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:radial-gradient(60% 40% at 12% 8%,#1d6a76 0,transparent 62%),radial-gradient(50% 40% at 92% 28%,#7a2e44 0,transparent 62%),radial-gradient(60% 50% at 30% 96%,#7a5a1e 0,transparent 62%),#0b181c;background-attachment:fixed}}
:root[data-theme="dark"] body{background:radial-gradient(60% 40% at 12% 8%,#1d6a76 0,transparent 62%),radial-gradient(50% 40% at 92% 28%,#7a2e44 0,transparent 62%),radial-gradient(60% 50% at 30% 96%,#7a5a1e 0,transparent 62%),#0b181c;background-attachment:fixed}
main{padding-bottom:120px}
.tabs,.modes,.small,.view button,.filters button{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12),0 8px 24px var(--glass-sh)}
span.small{visibility:hidden}
.tabs{left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:auto;max-width:448px;margin:0 auto;padding:6px;gap:4px;border-radius:999px}
.modes{padding:4px;gap:4px;border-radius:999px}
.tabs button,.modes button{border:0;border-radius:999px;background:transparent;color:var(--ink);max-width:none;padding:10px 14px}
.tabs button.on,.modes button.on,.filters button.on{background:var(--glass-on);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 2px 10px var(--glass-sh)}
.filters button{border-radius:999px;color:var(--ink)}
.view button{border-radius:999px;color:#fff}
.shot{border:5px solid rgba(255,255,255,.9);background:radial-gradient(circle at 35% 28%,#ff8a99,var(--red) 62%);box-shadow:inset 0 2px 4px rgba(255,255,255,.6),0 8px 24px var(--glass-sh)}
.stage{box-shadow:0 0 0 1px var(--glass-brd),0 18px 40px var(--glass-sh)}
.grid img{filter:drop-shadow(0 8px 14px var(--glass-sh))}
.view{background:rgba(8,22,27,.4);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.stage.stamp{padding:0;background:#000;border-radius:0;aspect-ratio:1;height:auto;box-shadow:none}
.stage.stamp.tall{aspect-ratio:7/10;height:min(56vh,520px);width:calc(min(56vh,520px)*.7);max-width:100%;margin:0 auto}
.stage.stamp::after{display:none}
.stage.stamp .date{left:7%;bottom:5%;color:#fff;text-shadow:0 1px 4px #000;font-size:15px}
</style>
</head>
<body>
<main>
 <section id="cam">
  <h1>Postie</h1>
  <div class="modes"><button id="mN" class="on">Thường</button><button id="mT">Tem</button></div>
  <div class="modes hide" id="shapes"><button id="sT" class="on">Tem dọc</button><button id="sS">Tem vuông</button></div>
  <div class="stage" id="stage"><div class="in" id="in">
    <video id="vid" playsinline muted autoplay></video>
    <img class="pv hide" id="pv" alt="">
    <div class="msg" id="msg"><span id="msgt">Chưa mở được camera.</span>
      <label>Chọn ảnh từ máy<input id="file" type="file" accept="image/*" capture="environment" class="hide"></label></div>
    <div class="date" id="dt"></div></div></div>
  <div class="row"><button class="small" id="flip" aria-label="Đổi camera">⟲</button><button class="shot" id="shot" aria-label="Chụp"></button><span class="small"></span></div>
  <p class="hint" id="hint">Ảnh chụp ra khung vuông bo tròn góc.</p>
 </section>
 <section id="col" class="hide">
  <h1 id="ct">Bộ sưu tập</h1>
  <div class="filters"><button data-f="all" class="on">Tất cả</button><button data-f="stamp">Tem</button><button data-f="normal">Ảnh thường</button></div>
  <div class="grid" id="grid"></div>
  <p class="empty hide" id="empty">Chưa có gì. Qua tab Chụp để làm tem đầu tiên.</p>
 </section>
</main>
<nav class="tabs"><button id="tC" class="on">Chụp</button><button id="tB">Bộ sưu tập</button></nav>
<div class="view" id="view"><img id="vimg" alt=""><p id="vinfo"></p><div class="act"><button id="vdel">Xóa</button><button id="vclose">Đóng</button></div></div>
<script>
(function(){
var KEY='tem-app-v1',mode='normal',facing='environment',stream=null,items=[],filter='all',cur=null,pending=null,shape='tall';
var $=function(i){return document.getElementById(i)};
function load(){try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items));return true}catch(e){return false}}
function fmt(d){d=new Date(d);return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear()}
function setMode(m){mode=m;$('mN').classList.toggle('on',m==='normal');$('mT').classList.toggle('on',m==='stamp');
 $('stage').classList.toggle('stamp',m==='stamp');$('shapes').classList.toggle('hide',m!=='stamp');applyShape();
 $('hint').textContent=m==='stamp'?'Ảnh chụp ra thành tem, tự vào bộ sưu tập tem.':'Ảnh chụp ra khung vuông bo tròn góc.'}
var SH={tall:{w:420,h:600,nx:10,ny:14},square:{w:480,h:480,nx:10,ny:10}};
function geo(){var s=SH[shape],sx=s.w/s.nx,sy=s.h/s.ny,p=[],i;
 for(i=0;i<s.nx;i++){p.push([(i+.5)*sx,0]);p.push([(i+.5)*sx,s.h])}
 for(i=0;i<s.ny;i++){p.push([0,(i+.5)*sy]);p.push([s.w,(i+.5)*sy])}
 return {pts:p,r:Math.min(sx,sy)*.34}}
function applyShape(){var st=$('stage'),s=SH[shape];st.classList.toggle('tall',mode==='stamp'&&shape==='tall');
 if(mode!=='stamp'){st.style.webkitMaskImage='none';st.style.maskImage='none';return}
 var g=geo(),svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+s.w+' '+s.h+'" preserveAspectRatio="none"><defs><mask id="m"><rect width="'+s.w+'" height="'+s.h+'" fill="#fff"/>'+g.pts.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+g.r+'" fill="#000"/>'}).join('')+'</mask></defs><rect width="'+s.w+'" height="'+s.h+'" mask="url(#m)"/></svg>';
 var u='url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
 st.style.webkitMaskImage=u;st.style.maskImage=u;st.style.webkitMaskSize='100% 100%';st.style.maskSize='100% 100%'}
function setShape(x){shape=x;$('sT').classList.toggle('on',x==='tall');$('sS').classList.toggle('on',x==='square');applyShape()}
function showMsg(t){$('msgt').textContent=t;$('msg').classList.add('show')}
async function start(){
 if(stream){stream.getTracks().forEach(function(t){t.stop()})}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});
  $('vid').srcObject=stream;$('msg').classList.remove('show')}
 catch(e){showMsg('Chưa mở được camera. Cho phép camera hoặc mở trang này bằng trình duyệt, hoặc chọn ảnh từ máy.')}}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function cover(c,src,sw,sh,x,y,w,h){var s=Math.max(w/sw,h/sh),dw=sw*s,dh=sh*s;c.drawImage(src,x+(w-dw)/2,y+(h-dh)/2,dw,dh)}
function render(src,sw,sh){
 var now=new Date(),cv=document.createElement('canvas'),c;
 if(mode==='normal'){cv.width=cv.height=480;c=cv.getContext('2d');
  c.save();rr(c,0,0,480,480,72);c.clip();cover(c,src,sw,sh,0,0,480,480);
  c.font='600 22px "Be Vietnam Pro",sans-serif';c.fillStyle='#fff';c.shadowColor='rgba(0,0,0,.7)';c.shadowBlur=6;
  c.fillText(fmt(now),28,448);c.restore()}
 else{var s=SH[shape],g=geo();cv.width=s.w;cv.height=s.h;c=cv.getContext('2d');
  cover(c,src,sw,sh,0,0,s.w,s.h);
  var n=items.filter(function(i){return i.type==='stamp'}).length+1;
  c.shadowColor='rgba(0,0,0,.7)';c.shadowBlur=6;c.fillStyle='#fff';
  c.font='600 22px "Be Vietnam Pro",sans-serif';c.fillText(fmt(now),s.w*.07,s.h*.94);
  c.textAlign='right';c.fillText('#'+n,s.w*.93,s.h*.94);c.textAlign='left';
  c.shadowBlur=0;c.shadowColor='transparent';
  c.globalCompositeOperation='destination-out';
  g.pts.forEach(function(p){c.beginPath();c.arc(p[0],p[1],g.r,0,7);c.fill()})}
 var d=cv.toDataURL('image/webp',.82);if(d.indexOf('image/webp')<0)d=cv.toDataURL('image/png');
 var it={id:String(now.getTime()),type:mode,img:d,date:now.toISOString()};
 items.unshift(it);if(!save()){items.shift();alert('Bộ nhớ trình duyệt đầy. Xóa bớt ảnh cũ trong bộ sưu tập rồi chụp lại.');return}
 flash(it)}
function flash(it){$('pv').src=it.img;$('pv').classList.remove('hide');$('vid').classList.add('hide');
 setTimeout(function(){$('pv').classList.add('hide');$('vid').classList.remove('hide')},900);updCount()}
function shoot(){var v=$('vid');if(!v.videoWidth){showMsg('Chưa có camera. Chọn ảnh từ máy để tiếp tục.');return}render(v,v.videoWidth,v.videoHeight)}
$('file').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var im=new Image();
 im.onload=function(){render(im,im.naturalWidth,im.naturalHeight);URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f);e.target.value=''});
function updCount(){var n=items.filter(function(i){return i.type==='stamp'}).length;$('ct').textContent='Bộ sưu tập ('+n+' tem)'}
function draw(){var g=$('grid');g.innerHTML='';var l=items.filter(function(i){return filter==='all'||i.type===filter});
 $('empty').classList.toggle('hide',l.length>0);
 l.forEach(function(it){var im=new Image();im.src=it.img;im.alt=(it.type==='stamp'?'Tem ':'Ảnh ')+fmt(it.date);
  im.onclick=function(){cur=it;$('vimg').src=it.img;$('vinfo').textContent=(it.type==='stamp'?'Tem':'Ảnh thường')+' · '+fmt(it.date)+'. Nhấn giữ ảnh để lưu về máy.';$('view').classList.add('show')};g.appendChild(im)});updCount()}
function tab(t){var c=t==='c';$('cam').classList.toggle('hide',!c);$('col').classList.toggle('hide',c);
 $('tC').classList.toggle('on',c);$('tB').classList.toggle('on',!c);if(!c)draw()}
$('mN').onclick=function(){setMode('normal')};$('mT').onclick=function(){setMode('stamp')};
$('sT').onclick=function(){setShape('tall')};$('sS').onclick=function(){setShape('square')};$('shot').onclick=shoot;$('flip').onclick=function(){facing=facing==='environment'?'user':'environment';start()};
$('tC').onclick=function(){tab('c')};$('tB').onclick=function(){tab('b')};
document.querySelectorAll('.filters button').forEach(function(b){b.onclick=function(){filter=b.dataset.f;
 document.querySelectorAll('.filters button').forEach(function(x){x.classList.toggle('on',x===b)});draw()}});
$('vclose').onclick=function(){$('view').classList.remove('show')};
$('vdel').onclick=function(){items=items.filter(function(i){return i!==cur});save();$('view').classList.remove('show');draw()};
$('dt').textContent=fmt(new Date());
load();updCount();start();
})();
</script>
</body>
</html>
